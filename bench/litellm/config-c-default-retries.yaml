# Labeled configuration only. run_compare.sh does not start this file.
# It is scenario C with LiteLLM's default retry count left in place
# (num_retries 2: two more tries of primary before fallback).
# cooldown_time stays 5 seconds, and allowed_fails stays unset, so the
# same >50% failures-in-the-current-minute rule applies.
model_list:
  - model_name: primary
    litellm_params:
      model: openai/primary
      api_base: http://127.0.0.1:19111/v1
      api_key: unused
  - model_name: fallback
    litellm_params:
      model: openai/fallback
      api_base: http://127.0.0.1:19111/v1
      api_key: unused

litellm_settings:
  success_callback: []
  failure_callback: []
  callbacks: []
  service_callback: []
  turn_off_message_logging: true

router_settings:
  cooldown_time: 5
  fallbacks:
    - primary:
        - fallback

general_settings:
  dangerously_permit_weak_or_unset_master_key: true
  store_model_in_db: false
  disable_spend_logs: true
  disable_error_logs: true
  disable_spend_updates: true

environment_variables:
  DISABLE_ADMIN_UI: "True"
