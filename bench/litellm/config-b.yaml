# Scenario B. One virtual key, with rpm and tpm high enough that the
# checks run and nothing is rejected.
#
# Footprint: LiteLLM will not enforce a virtual key's rpm_limit and
# tpm_limit without Postgres. The master key authenticates, and it has no
# per-key limit, so loadgen must not send it. FirePoint stores a sha256 of
# its key in a JSON file and checks the limit in process. It does not use
# this database. run_compare.sh starts Postgres on 127.0.0.1:54329.
# Schema migrations need the Python prisma package (not part of
# litellm[proxy]). setup.sh installs it.
model_list:
  # Name the client sends.
  - model_name: bench
    litellm_params:
      # openai/ selects the OpenAI chat protocol. The prefix is stripped
      # before the mock sees the name.
      model: openai/bench
      # The mock serves /v1/chat/completions on this port.
      api_base: http://127.0.0.1:19111/v1
      # The mock does not check Authorization. The OpenAI client refuses
      # to send a request when this is empty, so the value is a placeholder.
      api_key: unused
    # Deployment limits stay above the offered load. The limit under test
    # is the virtual key's rpm_limit and tpm_limit, not these.
    rpm: 1000000
    tpm: 100000000

# Callbacks stay empty so nothing is copied to a logger.
litellm_settings:
  # Nothing runs after a successful call.
  success_callback: []
  # Nothing runs after a failed call.
  failure_callback: []
  # Nothing runs on both outcomes.
  callbacks: []
  # No host metrics.
  service_callback: []
  # Keep message text out of any callback payload.
  turn_off_message_logging: true
  # A retry would issue a second stream.
  num_retries: 0

# Postgres holds the virtual key. database_url comes from the environment
# so the password is not written here.
general_settings:
  # Admin key used only to call /key/generate. Loadgen uses the generated key.
  master_key: os.environ/LITELLM_MASTER_KEY
  # Local Postgres started by run_compare.sh.
  database_url: os.environ/DATABASE_URL
  # Keep model config in this file. The key table still needs the database.
  store_model_in_db: false
  # Do not write a row per request.
  disable_spend_logs: true
  # Do not write error rows.
  disable_error_logs: true
  # Do not update stored spend. The key's rpm and tpm counters are separate.
  disable_spend_updates: true

environment_variables:
  # Do not mount the admin dashboard. /v1 stays up.
  DISABLE_ADMIN_UI: "True"
