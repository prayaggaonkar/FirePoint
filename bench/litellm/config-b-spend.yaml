# Labeled configuration only. run_compare.sh and verify.sh do not start this file.
# It is scenario B with spend logging and spend updates left at LiteLLM's
# defaults (those two keys are omitted). disable_error_logs stays on, matching
# config-b.yaml, so the only difference is the spend path.
# The database and the virtual key are still required. See config-b.yaml.
model_list:
  - model_name: bench
    litellm_params:
      model: openai/bench
      api_base: http://127.0.0.1:19111/v1
      api_key: unused
    rpm: 1000000
    tpm: 100000000

litellm_settings:
  success_callback: []
  failure_callback: []
  callbacks: []
  service_callback: []
  turn_off_message_logging: true
  num_retries: 0

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
  disable_error_logs: true

environment_variables:
  DISABLE_ADMIN_UI: "True"
