# Scenario C. num_retries is 0 so a 503 from primary falls straight through
# to fallback, which is how FirePoint tries the next model.
# The default is 2 retries on the same model before that hop. That shape is
# config-c-default-retries.yaml and is not what run_compare.sh starts.
#
# Cooldown, with allowed_fails left unset: more than 50% of calls to a
# deployment failing in the current minute cools that deployment down for
# cooldown_time. cooldown_time is LiteLLM's default of 5 seconds, written
# here so the value is the one this run uses.
model_list:
  # Client-facing name of the model that the mock rejects.
  - model_name: primary
    litellm_params:
      # openai/ is stripped. The mock sees "primary" and returns 503.
      model: openai/primary
      api_base: http://127.0.0.1:19111/v1
      api_key: unused
  # Healthy model. The mock streams it on the normal token schedule.
  - model_name: fallback
    litellm_params:
      model: openai/fallback
      api_base: http://127.0.0.1:19111/v1
      api_key: unused

litellm_settings:
  success_callback: []
  failure_callback: []
  callbacks: []
  service_callback: []
  turn_off_message_logging: true
  # No extra try of the deployment that just failed.
  num_retries: 0

router_settings:
  # Same hop as litellm_settings, so a router-level value cannot put the
  # default of 2 back.
  num_retries: 0
  # How long a cooled-down deployment stays out of rotation.
  cooldown_time: 5
  # primary fails over to fallback. No further hop.
  fallbacks:
    - primary:
        - fallback

# No database. database_url is omitted.
general_settings:
  # Local smoke process. No master key is set.
  dangerously_permit_weak_or_unset_master_key: true
  store_model_in_db: false
  disable_spend_logs: true
  disable_error_logs: true
  disable_spend_updates: true

environment_variables:
  DISABLE_ADMIN_UI: "True"
