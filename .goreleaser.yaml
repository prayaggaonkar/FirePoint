version: 2

builds:
  - id: firerouter
    main: ./cmd/firerouter
    binary: firerouter
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Tag }}
  - id: mockupstream
    main: ./cmd/mockupstream
    binary: mockupstream
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Tag }}
  - id: loadgen
    main: ./cmd/loadgen
    binary: loadgen
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Tag }}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

dockers:
  - image_templates:
      - ghcr.io/prayaggaonkar/firerouter:{{ .Tag }}-amd64
    dockerfile: deploy/Dockerfile
    use: buildx
    goos: linux
    goarch: amd64
    extra_files:
      - go.mod
      - go.sum
      - cmd
      - internal
    build_flag_templates:
      - --platform=linux/amd64
      - --build-arg=VERSION={{ .Tag }}
      - --build-arg=GO_VERSION=1.22.2
  - image_templates:
      - ghcr.io/prayaggaonkar/firerouter:{{ .Tag }}-arm64
    dockerfile: deploy/Dockerfile
    use: buildx
    goos: linux
    goarch: arm64
    extra_files:
      - go.mod
      - go.sum
      - cmd
      - internal
    build_flag_templates:
      - --platform=linux/arm64
      - --build-arg=VERSION={{ .Tag }}
      - --build-arg=GO_VERSION=1.22.2

docker_manifests:
  - name_template: ghcr.io/prayaggaonkar/firerouter:{{ .Tag }}
    image_templates:
      - ghcr.io/prayaggaonkar/firerouter:{{ .Tag }}-amd64
      - ghcr.io/prayaggaonkar/firerouter:{{ .Tag }}-arm64
