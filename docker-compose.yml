# Local metrics stack. Prometheus scrapes firerouter. Grafana reads Prometheus.
# The mock and the proxy are included so the dashboard has a live target.
# Grafana's admin password is admin. This file is for a laptop, not a public host.

services:
  mockupstream:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    entrypoint: ["mockupstream"]
    command: ["-addr", ":9000", "-first-token-delay", "50ms", "-token-interval", "10ms", "-tokens", "8"]

  firerouter:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    entrypoint: ["firerouter"]
    command: ["-listen", ":8080", "-upstream", "http://mockupstream:9000"]
    ports:
      - "8080:8080"
    depends_on:
      - mockupstream

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - firerouter

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/firerouter.json:/etc/grafana/dashboards/firerouter.json:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
