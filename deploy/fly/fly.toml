# Public mock-backed sandbox. Do not set FIREWORKS_API_KEY.
# The process exits on startup if that variable is present.
# Change app to a name that is free on your Fly account.
app = "firerouter-sandbox"
primary_region = "sjc"

[build]
  dockerfile = "deploy/fly/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 20
    soft_limit = 12

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
