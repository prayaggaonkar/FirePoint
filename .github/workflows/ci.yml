name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.2"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2024.1.1
          staticcheck ./...

      - name: test
        run: go test -race ./...

      - name: compat
        run: make compat

      - name: docker build
        run: |
          docker build -f deploy/Dockerfile \
            --build-arg VERSION=ci \
            --build-arg GO_VERSION=1.22.2 \
            -t firerouter:ci .
          docker run --rm firerouter:ci --version
